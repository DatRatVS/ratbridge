plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.gradleup.shadow'
}

base {
    archivesName = "${mod_id}-neoforge-${neoforge_minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

repositories {
    maven {
        name = 'ForgeGradleMinecraftUserRepo'
        url = uri("${gradle.gradleUserHomeDir}/caches/forge_gradle/minecraft_user_repo")
    }
    maven {
        name = 'NeoForge'
        url = uri('https://maven.neoforged.net/releases')
    }
    maven {
        name = 'MinecraftForge'
        url = uri('https://maven.minecraftforge.net/')
    }
    maven {
        name = 'MojangLibraries'
        url = uri('https://libraries.minecraft.net/')
    }
    mavenCentral()
}

configurations {
    shade
    implementation.extendsFrom(shade)
}

dependencies {
    compileOnly "net.neoforged:neoforge:${neoforge_version}:universal"
    // NeoGradle/NeoForm produced empty Mojang jars in this environment; use the ForgeGradle Mojmap jar as a compile-only Minecraft API classpath.
    compileOnly files("${gradle.gradleUserHomeDir}/caches/forge_gradle/minecraft_user_repo/net/minecraftforge/forge/${minecraft_version}-${forge_version}_mapped_official_${minecraft_version}/forge-${minecraft_version}-${forge_version}_mapped_official_${minecraft_version}.jar")

    implementation project(':common')
    shade project(':common')

    shade("net.dv8tion:JDA:${jda_version}") {
        exclude module: 'opus-java'
        exclude group: 'org.slf4j', module: 'slf4j-api'
        exclude group: 'com.google.code.gson', module: 'gson'
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            neoforge_minecraft_version      : neoforge_minecraft_version,
            neoforge_minecraft_version_range: neoforge_minecraft_version_range,
            neoforge_version                : neoforge_version,
            neoforge_version_range          : neoforge_version_range,
            neoforge_loader_version_range   : neoforge_loader_version_range,
            mod_id                          : mod_id,
            mod_name                        : mod_name,
            mod_license                     : mod_license,
            mod_version                     : mod_version,
            mod_authors                     : mod_authors,
            mod_description                 : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'thin'
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.named('shadowJar').configure {
    archiveClassifier = ''
    configurations = [project.configurations.shade]
    mergeServiceFiles()

    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
    exclude 'module-info.class'
    exclude 'META-INF/versions/**/module-info.class'
    exclude 'META-INF/maven/**'
    exclude 'META-INF/*.kotlin_module'

    relocate 'net.dv8tion.jda', 'datrat.ratbridge.shadow.net.dv8tion.jda'
    relocate 'okhttp3', 'datrat.ratbridge.shadow.okhttp3'
    relocate 'okio', 'datrat.ratbridge.shadow.okio'
    relocate 'kotlin', 'datrat.ratbridge.shadow.kotlin'
    relocate 'com.fasterxml.jackson', 'datrat.ratbridge.shadow.com.fasterxml.jackson'
    relocate 'com.neovisionaries', 'datrat.ratbridge.shadow.com.neovisionaries'
    relocate 'com.google.crypto', 'datrat.ratbridge.shadow.com.google.crypto'
    relocate 'com.google.protobuf', 'datrat.ratbridge.shadow.com.google.protobuf'
    relocate 'com.google.errorprone', 'datrat.ratbridge.shadow.com.google.errorprone'
    relocate 'com.google.j2objc', 'datrat.ratbridge.shadow.com.google.j2objc'
    relocate 'gnu.trove', 'datrat.ratbridge.shadow.gnu.trove'
    relocate 'org.apache.commons.collections4', 'datrat.ratbridge.shadow.org.apache.commons.collections4'
    relocate 'org.intellij.lang.annotations', 'datrat.ratbridge.shadow.org.intellij.lang.annotations'
    relocate 'org.jetbrains.annotations', 'datrat.ratbridge.shadow.org.jetbrains.annotations'
    relocate 'javax.annotation', 'datrat.ratbridge.shadow.javax.annotation'
}

tasks.named('build').configure {
    dependsOn tasks.named('shadowJar')
}
