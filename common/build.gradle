plugins {
    id 'java-library'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

def generatedSourcesDir = layout.buildDirectory.dir('generated/sources/ratbridgeInfo/java')

tasks.register('generateRatBridgeInfo') {
    def outputDir = generatedSourcesDir
    inputs.property('mod_id', mod_id)
    inputs.property('mod_name', mod_name)
    inputs.property('mod_version', mod_version)
    outputs.dir(outputDir)

    doLast {
        def packageDir = outputDir.get().asFile.toPath().resolve('datrat/ratbridge')
        mkdir packageDir
        packageDir.resolve('RatBridgeInfo.java').toFile().text = """package datrat.ratbridge;

public final class RatBridgeInfo {
    public static final String MOD_ID = "${mod_id}";
    public static final String MOD_NAME = "${mod_name}";
    public static final String VERSION = "${mod_version}";
    public static final String USER_AGENT = MOD_NAME + "/" + VERSION;

    private RatBridgeInfo() {
    }
}
"""
    }
}

sourceSets {
    main {
        java.srcDir(generatedSourcesDir)
    }
}

tasks.named('compileJava').configure {
    dependsOn tasks.named('generateRatBridgeInfo')
}

dependencies {
    implementation("net.dv8tion:JDA:${jda_version}") {
        exclude module: 'opus-java'
        exclude group: 'org.slf4j', module: 'slf4j-api'
        exclude group: 'com.google.code.gson', module: 'gson'
    }

    compileOnly 'org.slf4j:slf4j-api:2.0.1'
    compileOnly 'com.google.code.gson:gson:2.10'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'com.google.code.gson:gson:2.10'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.1'
}

tasks.named('test').configure {
    useJUnitPlatform()
}
